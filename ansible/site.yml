---
# Cross-platform patch status inventory: reports pending updates on both
# Windows and Linux hosts in a mixed environment, into one combined report.
# Run: ansible-playbook -i inventory.ini site.yml

- name: Check patch status on Linux hosts
  hosts: linux
  gather_facts: false
  tasks:
    - name: Check for pending apt upgrades
      ansible.builtin.command: apt list --upgradable
      register: apt_result
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Report pending upgrade count
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ (apt_result.stdout_lines | length) - 1 }} packages pending"
      when: ansible_facts['os_family'] == "Debian"

- name: Check patch status on Windows hosts
  hosts: windows
  gather_facts: false
  tasks:
    - name: Query pending Windows updates
      ansible.windows.win_updates:
        state: searched
      register: win_result

    - name: Report pending update count
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ win_result.updates | length }} updates pending"
